name: Build release installers

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        default: '1.1.0'
        required: true

permissions:
  contents: read

jobs:
  installer:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            name: macOS-Apple-Silicon
          - os: windows-2025
            name: Windows-x64
          - os: ubuntu-22.04
            name: Linux-x86_64
          - os: ubuntu-24.04-arm
            name: Linux-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build installer
        shell: bash
        env:
          CTT_VERSION: ${{ inputs.version || '1.1.0' }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then CTT_VERSION="${GITHUB_REF_NAME#v}"; fi
          python -X utf8 packaging/build.py "$CTT_VERSION"
      - name: Verify macOS image
        if: runner.os == 'macOS'
        run: hdiutil verify dist/*.dmg
      - name: Install and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -X utf8 test_install.py (Get-ChildItem dist/*.exe).FullName
      - name: Install and test on Linux
        if: runner.os == 'Linux'
        run: |
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP"
          python -X utf8 test_install.py "$RUNNER_TEMP"/Claude-Thinking-Translation-Linux-*/'安装 Claude 思考翻译'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish all verified installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets
          files=(Claude-Thinking-Translation-macOS-Apple-Silicon.dmg Claude-Thinking-Translation-Windows-x64-Setup.exe
                 Claude-Thinking-Translation-Linux-x86_64.tar.gz Claude-Thinking-Translation-Linux-aarch64.tar.gz)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Claude 思考翻译 $GITHUB_REF_NAME" \
            --notes-file ../packaging/release-notes.md "${files[@]}" SHA256SUMS.txt
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
